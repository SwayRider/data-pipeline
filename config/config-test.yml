          - overlap_iberian-peninsula_south-europe.poly
          - overlap_iberian-peninsula_uk-iceland.poly
          - overlap_iberian-peninsula_west-europe.poly
        osm:
          - europe/france
          - europe/ireland-and-northern-ireland
          - europe/italy
          - europe/monaco
          - europe/united-kingdom
        wof:
          - fr
          - ie
          - it
          - mc
          - gb
        openaddresses:
          - it/countrywide.csv
      srtm:
        - andorra: [ 42, 43, 1, 2]
        - portugal: [ 32, 43, -32, -5 ]
        - spain: [ 27, 44, -19, 5,]
