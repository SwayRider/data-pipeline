# Parallelisation for the generic pipeline
# tiles pipeline uses it's own internal parallelisation
max_workers: 6

# source data paths
source_paths:
  config: ./config
  border_polygons: ./gis/export/borders
  overlap_polygons: ./gis/export/overlap

# build paths
build_paths:
  download_dir: /mnt/hdd-pool/swayrider/data/pipeline/download
  temp_dir: /mnt/hdd-pool/swayrider/data/pipeline/tmp
  tools_dir: /mnt/hdd-pool/swayrider/data/pipeline/tools
  result_dir: /mnt/hdd-pool/swayrider/data/pipeline/result

# Download locations for public data
download_urls:
  osm: "https://download.geofabrik.de/"
  srtm: "s3://elevation-tiles-prod/skadi/"
  natural-earth: "https://naturalearth.s3.amazonaws.com/"
  osm-land-polygons: "https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip"

output:
  geodata_dir: /tmp/swayrider/geodata

# Valhalla setup details
valhalla:
  repo_base: https://github.com/valhalla
  repos:
    - valhalla:3.6.1:
        git-submodule-update: true
        cmake-build: true
        cmake-opts:
          - -DENABLE_PYTHON_BINDINGS=OFF
          - -DENABLE_SERVICES=OFF
          - -DENABLE_BENCHMARKS=OFF
          - -DENABLE_TESTS=OFF
          - -DCMAKE_CXX_FLAGS=-Wno-error=format-truncation -Wno-deprecated-declarations
        make-build: true
        make-opts:
          - all
          - -j4

# Definition of the pelias setup we will do
pelias:
  repo_base: https://github.com/pelias
  repos:
    - config:v6.0.0:
        npm-install: true
    - schema:v9.1.0:
        npm-intstall: true
        npm-extra-pkgs:
          - pelias-config
    - whosonfirst:v8.3.0:
        npm-install: true
        npm-extra-pkgs:
          - pelias-config
    - geonames:v6.3.0:
        npm-install: true
        npm-extra-pkgs:
          - pelias-config
    - openaddresses:v6.5.0:
        npm-install: true
        npm-extra-pkgs:
          - pelias-config
    - openstreetmap:v8.3.0:
        npm-install: true
        npm-extra-pkgs:
          - pelias-config
  config: pelias-load.json
  config_prod: pelias-prod.json
  placeholder_url: https://data.geocode.earth/placeholder/store.sqlite3.gz
  es_local_port: 39200
  es_host_prod: sw-dev-elasticsearch
  es_port_prod: 9200
  snapshot_repo_path: /usr/share/elasticsearch/snapshots
  snapshot_repo_name: pelias_repo
  elastic:
    version: 7.17.28
    api_version: 7.x
    host: localhost
    port: 39200

# definition of extra tools to build
tippecanoe:
  repo_base: https://github.com/mapbox
  repos:
    - tippecanoe:1.36.0:
        make-build: true

# GDAL
osgeo:
  repo_base: https://github.com/OSGeo
  repos:
    - gdal:v3.12.1:
        cmake-build: true
        cmake-compile: true

# Natural Eaurth files
natural_earth:
  - 10m_physical/ne_10m_land.zip
  - 10m_physical/ne_10m_ocean.zip
  - 10m_cultural/ne_10m_admin_0_countries.zip
  - 10m_cultural/ne_10m_urban_areas.zip
  - 10m_cultural/ne_10m_roads.zip

# Full size of the known region
region_size:
  min_lat: 20
  max_lat: 90
  min_lon: -40
  max_lon: 50 

# Size of a tile
tile_size: 10

# Definitions of the regions we need to build the tileserver data
tile_regions:
  - europe

# Definitions of the regions we need to build
# 
# OSM Interface:
#   https://download.geofabrik.de/
#
# WOS interface for determining country codes:
#   https://geocode.earth/data/whosonfirst#AD
#
# OpenAddress interface:
#   https://github.com/openaddresses/openaddresses/tree/master/data
regions:
  - iberian-peninsula:
      core:
        osm:
          - europe/andorra
          - europe/portugal
          - europe/spain
        wof:
          - ad
          - pt
          - es
        openaddresses:
          - pt/countrywide.csv
          - es/countrywide.csv
      overlap:
