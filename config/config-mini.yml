# Mini dev environment — benelux, france, germany only
#
# Parallelisation
max_workers: 2
#
# Source data paths — config points into the repo; gis_export must be set to a
# writable directory where generated polygon files (.poly) will be written.
source_paths:
  config: ./config                          # repo-relative, no change needed
  gis_export: /path/to/pipeline/gis/export  # ← set this

# Build paths — all four must be set to writable directories on your server.
build_paths:
  download_dir: /path/to/pipeline/download  # ← set this  (OSM PBFs, SRTM tiles, Natural Earth)
  temp_dir:     /path/to/pipeline/tmp       # ← set this  (intermediate working files)
  tools_dir:    /path/to/pipeline/tools     # ← set this  (compiled Valhalla, GDAL, Tippecanoe)
  result_dir:   /path/to/pipeline/result    # ← set this  (final tarballs and manifests)
  
# Output — where publish copies the finished geodata artifacts.
output:
  geodata_dir: /path/to/geodata  # ← set this

# Download locations for public data — no changes needed unless mirroring locally.
download_urls:
  osm: "https://download.geofabrik.de/"
  srtm: "s3://elevation-tiles-prod/skadi/"
  natural-earth: "https://naturalearth.s3.amazonaws.com/"
  osm-land-polygons: "https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip"


# Valhalla setup details
valhalla:
  repo_base: https://github.com/valhalla
  repos:
    - valhalla:latest:
        git-submodule-update: true
        cmake-build: true
        cmake-opts:
          - -DENABLE_PYTHON_BINDINGS=OFF
          - -DENABLE_SERVICES=OFF
          - -DENABLE_BENCHMARKS=OFF
          - -DENABLE_TESTS=OFF
          - -DCMAKE_CXX_FLAGS="-Wno-error=format-truncation"
          - -DCMAKE_POLICY_DEFAULT_CMP0144=OLD
          - -DSQLite3_INCLUDE_DIR=/opt/homebrew/opt/sqlite3/include
          - -DSQLite3_LIBRARY=/opt/homebrew/opt/sqlite3/lib/libsqlite3.dylib
          - -DSQLITE_ENABLE_LOAD_EXTENSION=ON
          - -DSQLITE_ROOT_DIR=/opt/homebrew/opt/sqlite3
          - -DProtobuf_ROOT=/opt/homebrew/Cellar/protobuf/33.4_1
          - -DProtobuf_INCLUDE_DIR=/opt/homebrew/Cellar/protobuf/33.4_1/include
          - -DProtobuf_LIBRARY=/opt/homebrew/Cellar/protobuf/33.4_1/lib/libprotobuf.dylib
          - -DBOOST_ROOT=/opt/homebrew/opt/boost
          - -DABSL_ROOT=/opt/homebrew/opt/abseil
        make-build: true
        make-opts:
          - all
          - -j4

# Definition of the pelias setup we will do
pelias:
  repo_base: https://github.com/pelias
  repos:
    - schema:latest:
        npm-intstall: true
    - whosonfirst:latest:
        npm-install: true
    - geonames:latest:
        npm-install: true
    - openaddresses:latest:
        npm-install: true
    - openstreetmap:latest:
        npm-install: true
    - polylines:latest:
        npm-install: true
    - csv:latest:
        npm-install: true
    - transit:v1.0.0:
        npm-install: true
  config: pelias-load.json
  config_prod: pelias-prod.json
  placeholder_url: https://data.geocode.earth/placeholder/2021-08-01/store.sqlite3.gz
  es_local_port: 39200
  es_host_prod: sw-dev-elasticsearch
  es_port_prod: 9200
  snapshot_repo_path: /usr/share/elasticsearch/snapshots
  snapshot_repo_name: pelias_repo
  elastic:
    version: 7.17.28
    api_version: 7.x
    host: localhost
    port: 39200

# definition of extra tools to build
tippecanoe:
  repo_base: https://github.com/felt
  repos:
    - tippecanoe:latest:
        make-build: true

# GDAL
osgeo:
  repo_base: https://github.com/OSGeo
  repos:
    - gdal:latest:
        cmake-build: true
        cmake-compile: true
        cmake-opts:
          - -DCMAKE_PREFIX_PATH=/opt/homebrew
          - -DGDAL_USE_AVIF=OFF
          - -DGDAL_ENABLE_DRIVER_AVIF=OFF

# Natural Earth files
natural_earth:
  - 10m_physical/ne_10m_land.zip
  - 10m_physical/ne_10m_ocean.zip
  - 10m_cultural/ne_10m_admin_0_countries.zip
  - 10m_cultural/ne_10m_urban_areas.zip
  - 10m_cultural/ne_10m_roads.zip

# Full size of the known region
region_size:
  min_lat: 40
  max_lat: 60
  min_lon: -10
  max_lon: 20

# Size of a tile
tile_size: 10

# Definitions of the regions we need to build the tileserver data
tile_regions:
  - europe

